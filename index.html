<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna & Sol</title>
    <style>
        :root {
            --primary: #ff6b81;
            --bg: #fff0f3;
            --text: #2f3542;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(255, 107, 129, 0.1);
        }
        h1 {
            color: var(--primary);
            font-size: 28px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            width: 80%;
            font-weight: bold;
        }
        button:hover {
            background-color: #ff4757;
        }
        input {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ffcccc;
            border-radius: 8px;
            text-align: center;
            width: 70%;
            margin-bottom: 10px;
        }
        .hidden { display: none; }
        .symptom-btn {
            background-color: #f1f2f6;
            color: var(--text);
            width: 45%;
            margin: 5px;
        }
        .symptom-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .tip-card {
            background: #ffeaa7;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Luna & Sol 🌙☀️</h1>
        <p id="status-msg">Conectando...</p>

        <!-- PANTALLA DE INICIO -->
        <div id="screen-role" class="hidden">
            <p>¿Quién eres?</p>
            <button onclick="elegirRol('novia')">Soy la Novia 🌸</button>
            <button onclick="elegirRol('novio')">Soy el Novio 🧸</button>
        </div>

        <!-- PANTALLA CÓDIGO -->
        <div id="screen-code" class="hidden">
            <p>Tu Código de Pareja es:</p>
            <h2 id="couple-code-display" style="letter-spacing: 3px; color: var(--primary);">---</h2>
            <p style="font-size: 12px;">Comparte este código con tu novio.</p>
            <button onclick="entrarDashboardNovia()">Ir a mi calendario</button>
        </div>

        <!-- PANTALLA INGRESAR CÓDIGO NOVIO -->
        <div id="screen-join" class="hidden">
            <p>Ingresa el Código de Pareja:</p>
            <input type="text" id="input-code" placeholder="Ej. A1B2C" style="text-transform: uppercase;">
            <button onclick="unirseNovio()">Sincronizar</button>
        </div>

        <!-- DASHBOARD NOVIA -->
        <div id="dashboard-novia" class="hidden">
            <h2>Mi Día 🌸</h2>
            <p>¿Cómo te sientes hoy?</p>
            <button class="symptom-btn" id="btn-colicos" onclick="toggleSintoma('Cólicos')">Cólicos 😣</button>
            <button class="symptom-btn" id="btn-sensible" onclick="toggleSintoma('Sensible')">Sensible 🥺</button>
            <button class="symptom-btn" id="btn-feliz" onclick="toggleSintoma('Feliz')">Feliz ✨</button>
            <button class="symptom-btn" id="btn-cansada" onclick="toggleSintoma('Cansada')">Cansada 🥱</button>
            <br><br>
            <button onclick="togglePeriodo()" id="btn-periodo" style="background-color: #7bed9f; color: #2ed573;">🩸 Marcar Inicio de Periodo</button>
        </div>

        <!-- DASHBOARD NOVIO -->
        <div id="dashboard-novio" class="hidden">
            <h2>Resumen de tu Novia 🧸</h2>
            <div id="novio-status">Esperando datos...</div>
            <div id="novio-tips" class="tip-card hidden"></div>
        </div>
    </div>

    <!-- SCRIPTS DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // TUS CREDENCIALES EXACTAS
        const firebaseConfig = {
            apiKey: "AIzaSyCWhFBT24e5M6RbObTyvGXT5AJJikcikq8",
            authDomain: "loba-e6a26.firebaseapp.com",
            projectId: "loba-e6a26",
            storageBucket: "loba-e6a26.firebasestorage.app",
            messagingSenderId: "890108700424",
            appId: "1:890108700424:web:8f72473626370fb445eebd",
            measurementId: "G-WLBBSWX8YM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let miCodigo = "";
        let sintomasActuales = [];
        let enPeriodo = false;

        // Autenticación anónima
        signInAnonymously(auth).then(() => {
            document.getElementById('status-msg').classList.add('hidden');
            document.getElementById('screen-role').classList.remove('hidden');
        }).catch((error) => {
            document.getElementById('status-msg').innerText = "Error de conexión: Activa el modo anónimo en Firebase.";
        });

        // Funciones Globales para el HTML
        window.elegirRol = function(rol) {
            document.getElementById('screen-role').classList.add('hidden');
            if(rol === 'novia') {
                miCodigo = Math.random().toString(36).substring(2, 7).toUpperCase();
                document.getElementById('couple-code-display').innerText = miCodigo;
                document.getElementById('screen-code').classList.remove('hidden');
                
                // Crear documento vacío en Firebase
                setDoc(doc(db, "parejas", miCodigo), { sintomas: [], periodo: false });
            } else {
                document.getElementById('screen-join').classList.remove('hidden');
            }
        }

        window.entrarDashboardNovia = function() {
            document.getElementById('screen-code').classList.add('hidden');
            document.getElementById('dashboard-novia').classList.remove('hidden');
        }

        window.unirseNovio = function() {
            const codigo = document.getElementById('input-code').value.toUpperCase();
            if(codigo.length === 5) {
                document.getElementById('screen-join').classList.add('hidden');
                document.getElementById('dashboard-novio').classList.remove('hidden');
                escucharDatos(codigo);
            }
        }

        // Lógica de la Novia
        window.toggleSintoma = function(sintoma) {
            if(sintomasActuales.includes(sintoma)) {
                sintomasActuales = sintomasActuales.filter(s => s !== sintoma);
            } else {
                sintomasActuales.push(sintoma);
            }
            actualizarFirebase();
            // Cambiar color de botones
            document.querySelectorAll('.symptom-btn').forEach(btn => {
                if(sintomasActuales.includes(btn.innerText.split(' ')[0])) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        window.togglePeriodo = function() {
            enPeriodo = !enPeriodo;
            const btn = document.getElementById('btn-periodo');
            btn.style.backgroundColor = enPeriodo ? 'var(--primary)' : '#7bed9f';
            btn.style.color = 'white';
            btn.innerText = enPeriodo ? "🩸 En Periodo" : "🩸 Marcar Inicio de Periodo";
            actualizarFirebase();
        }

        function actualizarFirebase() {
            setDoc(doc(db, "parejas", miCodigo), {
                sintomas: sintomasActuales,
                periodo: enPeriodo
            }, { merge: true });
        }

        // Lógica del Novio (Escucha en tiempo real)
        function escucharDatos(codigo) {
            onSnapshot(doc(db, "parejas", codigo), (doc) => {
                if (doc.exists()) {
                    const data = doc.data();
                    let html = `<p><b>Estado del ciclo:</b> ${data.periodo ? '🩸 Está en su periodo' : '🌸 Fase regular'}</p>`;
                    html += `<p><b>Se siente:</b> ${data.sintomas.length > 0 ? data.sintomas.join(', ') : 'Todo tranquilo'}</p>`;
                    document.getElementById('novio-status').innerHTML = html;

                    // Generar Tips
                    const tipsDiv = document.getElementById('novio-tips');
                    tipsDiv.classList.remove('hidden');
                    if(data.sintomas.includes('Sensible')) {
                        tipsDiv.innerHTML = "💡 <b>Tip de novio:</b> Está sensible. Mándale un mensajito lindo y tenle mucha paciencia hoy.";
                    } else if(data.sintomas.includes('Cólicos')) {
                        tipsDiv.innerHTML = "💡 <b>Tip de novio:</b> ¡Alerta de cólicos! Prepárale un té caliente, llévale un chocolate o dale un masajito.";
                    } else if(data.sintomas.includes('Cansada')) {
                        tipsDiv.innerHTML = "💡 <b>Tip de novio:</b> Hoy necesita descansar. Ayúdale con alguna de sus tareas o propón una tarde de películas en cama.";
                    } else {
                        tipsDiv.innerHTML = "💡 <b>Tip de novio:</b> Todo va bien. ¡Dile lo mucho que la quieres!";
                    }
                } else {
                    document.getElementById('novio-status').innerText = "Código incorrecto o novia aún no conectada.";
                }
            });
        }
    </script>
</body>
</html>
